<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Catoral Collage</title>
  <meta name="description" content="Election Site about my cat">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="img/12865-copy.jpg">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
  <!--Put fonts down here-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Phoenician&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Place your site's HTML here -->
  
  <div class="the-viewport">

   <div class="landing-cta">
    
    <div class="cta-content-container">

      <div>
        <a href="#candidates" class="cta-button">View Candidates</a>
      </div>
      
      <div>
        <img class="cta-image" src="img/Cat_Chair.jpg" alt="">
      </div>

      <div class="cta-content">
        <p>VOTE NOW for your favorite candidate!</p>
      </div>

    </div>

   </div>
   
   <main>
    
    <form id="form" action="">
      
      <!-- candidate portraits -->
      <div class="candidate-exhibit">
        <div class="candidate-portrait">
          <img src="img/Judgeful-Janice.jpg">
          <p>Judgeful Janice</p>
        </div>

        <div class="candidate-portrait">
          <img src="img/Susan-The-Insouciant.jpg"
          <p>Susan The Insouciant</p>
        </div>

        <div class="candidate-portrait">
          <img src="img/lead-stare-lenny.jpg">
          <p>Lead Stare Lenny</p>
        </div>

        <div class="candidate-portrait">
          <img src="img/Mellow-Margot.jpg">
          <p>Mellow Margot</p>
        </div>

        <div class="candidate-portrait">
          <img src="img/Leeroy-McLicker.jpg">
          <p>Leeroy McLicker</p>
        </div>

        <div class="candidate-portrait">
          <img src="img/Mr-Mogbert.jpg">
          <p>Mr Mogbert</p>
        </div>
      </div>
      
      <!-- Candidate options -->
      <fieldset>
        <legend>
          So... WHO will it BE!??
        </legend>
        
        <div class="candidate-options">
        
          <div>
            <input type="radio" id="candidateOption1" name="candidate" value="Judgeful Janice" required/>
            <label for="candidateOption1">Judgeful Janice</label>
          </div>

          <div>
            <input type="radio" id="candidateOption2" name="candidate" value="Lead Stare Lenny" required/>
            <label for="candidateOption2">Lead Stare Lenny</label>
          </div>

          <div>
            <input type="radio" id="candidateOption3" name="candidate" value="Leeroy McLicker" required/>
            <label for="candidateOption3">Leeroy McLicker</label>
          </div>

          <div>
            <input type="radio" id="candidateOption4" name="candidate" value="Mellow Margot" required/>
            <label for="candidateOption4">Mellow Margot</label>
          </div>

          <div>
            <input type="radio" id="candidateOption5" name="candidate" value="Mr Mogbert" required/>
            <label for="candidateOption5">Mr Mogbert</label>
          </div>

          <div>
            <input type="radio" id="candidateOption6" name="candidate" value="Susan The Insouciant" required/>
            <label for="candidateOption6">Susan The Insouciant</label>
          </div>

        </div>
      </fieldset>

      <!-- User name, email, and quote input -->
      <div class="info-input" id="candidates">
        <div class="form-element">
          <label for="name">Your name:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-element">
          <label for="email">AND your email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-element">
          <label for="message">Quote of the day?</label>
          <textarea id="message" name="message" placeholder="Message" required></textarea>
        </div>

        <input class="submit-vote-button" type="submit" value="Submit">
      </div>
    </form>
    
    <!-- Submission results pop-up window -->
    <dialog class="submission-confirmation" id="submission-confirmation" aria-labelledby="confirmation-title">
      <p>Thank you for voting for <span id="confirmation-candidate"></span>, <span id="confirmation-name"></span>!</p>
      <p>And remember... <span id="confirmation-message"></span></p>
      <button class="confirmation-close" type="button">Close</button>
    </dialog>
  </main>
  
  <script src="js/main.js"></script>
</body>

</html>
