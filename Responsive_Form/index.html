<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Catoral Collage</title>
  <meta name="description" content="Election Site about my cat">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="img/12865-copy.jpg">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
  <!--Put fonts down here-->
</head>

<body>
  <!-- Place your site's HTML here -->
  
  <div class="the-viewport">

   <div class="landing-cta">
    
    <div class="cta-content-container">

      <div>
        <a href="#candidates" class="cta-button">View Candidates</a>
      </div>
      
      <div>
        <img class="cta-image" src="img/Cat_Chair.jpg" alt="">
      </div>

      <div class="cta-content">
        <p>VOTE NOW for your favorite candidate!</p>
      </div>

    </div>

   </div>
   
   <main>
    
    <form id="form" action="./thank-you.html">   
      <fieldset>
        <legend>
          So... WHO will it BE!??
        </legend>

        <div class="candidate-options">
        
          <div>
            <input type="radio" id="candidateOption1" name="contact" value="email" />
            <label for="candidateOption1">Placeholder-Name</label>
          </div>

          <div>
            <input type="radio" id="candidateOption2" name="contact" value="phone" />
            <label for="candidateOption2">Placeholder-Name</label>
          </div>

          <div>
            <input type="radio" id="candidateOption3" name="contact" value="mail" />
            <label for="candidateOption3">Placeholder-Name</label>
          </div>

          <div>
            <input type="radio" id="candidateOption4" name="contact" value="in-person" />
            <label for="candidateOption4">Placeholder-Name</label>
          </div>

          <div>
            <input type="radio" id="candidateOption5" name="contact" value="in-person" />
            <label for="candidateOption5">Placeholder-Name</label>
          </div>

          <div>
            <input type="radio" id="candidateOption6" name="contact" value="in-person" />
            <label for="candidateOption6">Placeholder-Name</label>
          </div>

        </div>
      </fieldset>

      <div class="info-input">
        <div class="form-element">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-element">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-element">
          <label for="message">Quote of the day?</label>
          <textarea id="message" name="message" placeholder="Message" required></textarea>
        </div>

        <input class="order-now-link" type="submit" value="Submit">
      </div>
    </form>
    
   </main>
  </div>

  
  <script src="js/main.js"></script>
</body>

</html>
